name: API Types

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to receive the rebuilt artifact
        required: true
        type: string
      publish_foundry:
        description: Register the published module release in Foundry's package directory
        required: true
        default: false
        type: boolean
      source_ref:
        description: Source ref containing the API declarations
        required: false
        type: string
      update_registry:
        description: Publish the API package during this manual repair
        required: true
        default: false
        type: boolean

run-name: >-
  API types for libCamera ${{ inputs.tag || github.event.release.tag_name }}

permissions:
  contents: write
  id-token: write

jobs:
  api-types:
    runs-on: ubuntu-latest
    env:
      RELEASE_CHANNEL: ${{ vars.RELEASE_CHANNEL || 'public' }}
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.tag || github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build API type package
        run: |
          yarn build:api-types
          node --input-type=module -e "import fs from 'node:fs'; const pkg = JSON.parse(fs.readFileSync('.release/api-types/package/package.json', 'utf8')); fs.appendFileSync(process.env.GITHUB_ENV, 'NPM_DIST_TAG=' + pkg.publishConfig.tag + '\n');"
          tar -czf lib-camera-api-types.tgz -C .release/api-types package

      - name: Compare API type package with npm
        id: api
        run: yarn check:api-types

      - name: Use an npm CLI with trusted publishing support
        if: steps.api.outputs.api_status == 'new' && (github.event_name == 'release' || inputs.update_registry)
        run: npm install --global npm@11

      - name: Publish premium API prerelease
        if: env.RELEASE_CHANNEL == 'premium' && steps.api.outputs.api_status == 'new' && (github.event_name == 'release' || inputs.update_registry)
        run: npm publish .release/api-types/package --access public --tag ea

      - name: Publish public API release
        if: env.RELEASE_CHANNEL == 'public' && steps.api.outputs.api_status == 'new' && (github.event_name == 'release' || inputs.update_registry)
        run: npm publish .release/api-types/package --access public --tag "$NPM_DIST_TAG"

      - name: Upload API type artifact
        if: steps.api.outputs.api_status != 'existing'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" lib-camera-api-types.tgz --clobber

      - name: Register release with Foundry
        if: github.event_name == 'release' || inputs.publish_foundry
        env:
          GH_TOKEN: ${{ github.token }}
          FVTT_TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}
        run: |
          test -n "$FVTT_TOKEN"
          gh release download "$RELEASE_TAG" --pattern module.json --dir /tmp/foundry-release
          jq -e --arg tag "$RELEASE_TAG" '.id == "lib-camera" and ("v" + .version == $tag) and (.protected != true)' /tmp/foundry-release/module.json
          jq -n \
            --arg id "$(jq -r .id /tmp/foundry-release/module.json)" \
            --arg version "$(jq -r .version /tmp/foundry-release/module.json)" \
            --arg manifest "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/module.json" \
            --arg notes "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" \
            --argjson compatibility "$(jq .compatibility /tmp/foundry-release/module.json)" \
            '{id: $id, release: {version: $version, manifest: $manifest, notes: $notes, compatibility: $compatibility}}' \
            > /tmp/foundry-release/payload.json
          # Retry rate limits and temporary server failures; honour Retry-After when supplied.
          curl --fail-with-body \
            --retry 5 --retry-delay 30 --retry-max-time 300 \
            --connect-timeout 15 --max-time 60 \
            --output /tmp/foundry-release/response.json \
            --request POST \
            --header 'Content-Type: application/json' \
            --header "Authorization: $FVTT_TOKEN" \
            --data @/tmp/foundry-release/payload.json \
            https://api.foundryvtt.com/_api/packages/release_version/
          jq -e '.status == "success"' /tmp/foundry-release/response.json
